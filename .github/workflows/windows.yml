name: Windows

on:
  push:
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Build with this version and attach the Windows downloads to this existing release (e.g. v1.20.8). Leave empty to skip.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag) { $v = $tag.TrimStart('v') }
          else { $v = (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText }
          # Windows version resources need plain numbers: 1.2.3-beta → 1.2.3
          $v = ($v -replace '[^0-9.].*$', '')
          if ($v -notmatch '^\d+(\.\d+){1,3}$') { "bad version '$v'"; exit 1 }
          "VERSION=$v" >> $env:GITHUB_ENV
          "Building $v"

      - name: Test
        run: dotnet test tests/ShotPark.Tests -c Release

      - name: Publish portable zips (single exe, no .NET install needed)
        run: |
          foreach ($rid in 'x64', 'arm64') {
            dotnet publish src/ShotPark.Win/ShotPark.Win.csproj -c Release -r win-$rid --self-contained true `
              -p:Version=$env:VERSION -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out/single-$rid
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Compress-Archive out/single-$rid/ShotPark.exe "out/ShotPark-Windows-$rid.zip" -Force
          }

      - name: Publish app folders for the installer
        run: |
          foreach ($rid in 'x64', 'arm64') {
            dotnet publish src/ShotPark.Win/ShotPark.Win.csproj -c Release -r win-$rid --self-contained true `
              -p:Version=$env:VERSION -p:DebugType=none -o out/app-$rid
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Build installer (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          (Get-Item $iscc).VersionInfo.ProductVersion
          if (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\Languages\Korean.isl") { "Korean.isl: compiler's" } else { "Korean.isl: bundled copy" }
          & $iscc /Q "/DAppVersion=$env:VERSION" "/DSrcX64=$pwd\out\app-x64" "/DSrcArm64=$pwd\out\app-arm64" "/DOutDir=$pwd\out" installer\ShotPark.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem out/*.zip, out/*.exe | Format-Table Name, Length

      - name: Installer smoke test (silent install, run, uninstall)
        run: |
          $p = Start-Process out/ShotPark-Windows-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/TASKS=autostart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { "setup exit $($p.ExitCode)"; exit 1 }
          $app = "$env:LOCALAPPDATA\Programs\ShotPark"
          if (-not (Test-Path "$app\ShotPark.exe")) { "ShotPark.exe not installed"; exit 1 }
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).ShotPark
          "autostart: $run"
          if (-not $run) { "autostart value missing"; exit 1 }
          $r = Start-Process "$app\ShotPark.exe" -ArgumentList '--rendertest', "$pwd\out\render" -Wait -PassThru
          Get-Content out/render/rendertest.log
          if ($r.ExitCode -ne 0) { exit 1 }
          $u = Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 5
          if (Test-Path "$app\ShotPark.exe") { "uninstall left ShotPark.exe behind"; exit 1 }
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).ShotPark
          if ($run) { "uninstall left the autostart value"; exit 1 }

          # Updating over a running copy must not stop and ask the user to quit it.
          $p = Start-Process out/ShotPark-Windows-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/TASKS=' -Wait -PassThru
          if ($p.ExitCode -ne 0) { "re-install exit $($p.ExitCode)"; exit 1 }
          Start-Process "$app\ShotPark.exe"
          Start-Sleep -Seconds 4
          if (-not (Get-Process ShotPark -ErrorAction SilentlyContinue)) { "app did not start"; exit 1 }
          $p = Start-Process out/ShotPark-Windows-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/TASKS=' -Wait -PassThru
          if ($p.ExitCode -ne 0) { "update over a running copy failed: exit $($p.ExitCode)"; exit 1 }
          Start-Process "$app\ShotPark.exe"
          Start-Sleep -Seconds 3
          $u = Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 5
          if (Test-Path "$app\ShotPark.exe") { "uninstall over a running copy left files"; exit 1 }
          "installer OK"

      - uses: actions/upload-artifact@v4
        with:
          name: ShotPark-Windows
          path: |
            windows/out/*.zip
            windows/out/ShotPark-Windows-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: render-previews
          path: windows/out/render

      - name: Attach to release
        if: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag != null }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: gh release upload "$env:RELEASE_TAG" out/ShotPark-Windows-Setup.exe out/ShotPark-Windows-x64.zip out/ShotPark-Windows-arm64.zip --clobber
